name: Sync Odoo stock

on:
  schedule:
    # Cada 5 minutos (mínimo permitido por GitHub Actions).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-odoo-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stock sync
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://kliniucolombia.com/api/cron/sync-odoo-stock"
